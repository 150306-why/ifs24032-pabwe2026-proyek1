# Menjalankan seluruh aplikasi secara lokal: docker compose up --build
# Prasyarat: salin backend/.env.example ke backend/.env dan isi JWT_SECRET + password seed.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 3000
      DB_PATH: /data/tobatix.db
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - tobatix-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  tobatix-data: {}
